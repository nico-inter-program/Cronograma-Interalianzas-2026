<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juegos Inter Alianzas 2026</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: marcador deportivo. Cabecera tipo tablero con franja tricolor fina, pestañas segmentadas; cronograma día → deporte → bloque, filas con la hora a la izquierda como una planilla de mesa de control. */
:root{ color-scheme:light;
  --paper:#ffffff; --panel:#ffffff; --ink:#101a33; --muted:#5b6682; --line:#d8deeb; --soft:#eef1f7;
  --blue:#1d3db8; --red:#d42a3b; --ok:#177a48;
  --bas:#c8561a; --vol:#1d3db8; --atl:#177a48;
  --gold:#a87a06; --silver:#6f7a8d; --bronze:#9a5328;
  --logo-bg:#ffffff; --damas:#b0306b; --varones:#0d6d78;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.board{border-bottom:1px solid var(--line);background:var(--panel)}
.tri{height:4px;background:linear-gradient(90deg,var(--blue) 0 33.3%,var(--panel) 33.3% 66.6%,var(--red) 66.6%)}
.board .wrap{padding-block:20px 0}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:13px;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;margin:4px 0 6px;text-wrap:balance;letter-spacing:.01em}
.motto{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--blue);margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
nav.tabs{display:flex;gap:2px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--f-display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{padding-top:22px;display:grid;gap:22px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:grid;gap:10px}
.chip{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .ic{width:16px;height:16px}
h2{font-family:var(--f-display);font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
h3{font-family:var(--f-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:28px}
.stat .n{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day{display:grid;gap:14px;padding-top:6px}
.dayhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sport{display:grid;gap:8px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.bas{color:var(--bas)} .ic.vol{color:var(--vol)} .ic.atl{color:var(--atl)}
.sport h3 .ic{width:24px;height:24px}
.block{display:grid;gap:4px}
.bcap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 2px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.match{display:grid;grid-template-columns:78px 1fr auto 1fr;align-items:center;gap:6px 10px;padding:10px 14px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.match.can{cursor:pointer}
.match.can:hover{background:var(--soft)}
.hora{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hora .ic{width:18px;height:18px}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team.r{justify-content:flex-end;text-align:right}
.team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sw{width:8px;height:20px;border-radius:2px;flex:none}
.lg{width:28px;height:28px;object-fit:contain;flex:none;background:var(--logo-bg);border-radius:4px;padding:2px;vertical-align:middle}
td .lg{width:24px;height:24px;margin-right:6px}
.crests{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px}
.crest{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.crest .lg{width:40px;height:40px}
button.crest{background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px 4px 4px;color:inherit;cursor:pointer}
button.crest:hover{border-color:var(--line);background:var(--soft)}
.scrim{position:fixed;inset:0;background:rgba(16,26,51,.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.sheet{background:var(--panel);border-radius:8px;width:100%;max-width:820px;padding:20px;display:grid;gap:18px;box-shadow:0 20px 50px rgba(16,26,51,.25)}
.sheethead{display:flex;align-items:center;gap:14px}
.sheethead .lg{width:56px;height:56px}
.sheethead h2{flex:1}
.x-btn{background:none;border:1px solid var(--line);border-radius:4px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.roster{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;align-content:start}
.roster h3{font-size:17px}
.coach{font-size:13px;color:var(--muted)}
.coach b{color:var(--ink);font-weight:600}
.roster ol{margin:0;padding-left:22px;display:grid;gap:2px;font-size:14px}
.roster textarea{font:14px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;min-height:150px;resize:vertical}
.cattitle{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--ink);padding-bottom:4px}
.score{font-family:var(--f-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;min-width:84px;justify-content:center}
.score .v{color:var(--muted);font-size:16px;font-weight:600}
.score .lz{color:var(--muted)}
.mrow2{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;align-items:center;font-size:12px;color:var(--muted)}
.pill{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:3px;border:1px solid var(--line);white-space:nowrap}
.pill.vivo{background:var(--red);color:#fff;border-color:var(--red)}
.pill.final{border-color:var(--ink);color:var(--ink)}
.pill.cat{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.pill.cat.damas{background:var(--damas);border-color:var(--damas);color:#fff}
.pill.cat.varones{background:var(--varones);border-color:var(--varones);color:#fff}
.atlrow{display:grid;grid-template-columns:78px 1fr auto;gap:4px 10px;align-items:center;padding:10px 14px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.atlrow.can{cursor:pointer}.atlrow.can:hover{background:var(--soft)}
.atlrow .pr{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.atlrow .win{font-size:13px;color:var(--muted);text-align:right}
.evt{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 14px;align-items:center}
.editor{padding:14px;border-top:1px dashed var(--line);background:var(--soft);display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select{font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-display);font-size:20px;font-weight:700}
input[type=color]{padding:2px;height:36px}
.btn{font:600 14px var(--f-body);border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tr:first-child td{border-top:0}
th:first-child,td:first-child{text-align:left}
td.pts{font-family:var(--f-display);font-weight:700;font-size:18px}
.pos{font-family:var(--f-display);font-weight:700;color:var(--muted);display:inline-block;width:18px}
.tcap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 12px 4px;flex-wrap:wrap}
.medal{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font:700 12px var(--f-display);color:#fff;flex:none}
.m1{background:var(--gold)} .m2{background:var(--silver)} .m3{background:var(--bronze)} .mx{background:var(--soft);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px;align-content:start}
.pod{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 10px;align-items:center;font-size:14px}
.pod .mk{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.pod .pt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.resrow{display:grid;grid-template-columns:28px 1.3fr 1.3fr 1fr;gap:6px;align-items:center}
@media (max-width:520px){.resrow{grid-template-columns:24px 1fr 1fr}.resrow .mkin{grid-column:2/-1}}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:22px;color:var(--muted);display:grid;gap:10px;justify-items:start}
.note{font-size:13px;color:var(--muted);max-width:72ch;margin:0}
.teamrow{display:grid;grid-template-columns:2fr 1.2fr 80px 56px auto;gap:8px;align-items:end}
@media (max-width:620px){.teamrow{grid-template-columns:1fr 1fr}.teamrow .x{grid-column:1/-1}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:4px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.ro{font-size:13px;color:var(--muted)}
@media (max-width:520px){
  .match{grid-template-columns:1fr auto 1fr;padding:10px}
  .match .hora{grid-column:1/-1}
  .mrow2{grid-column:1/-1}
  .score{font-size:22px;min-width:70px}
  .atlrow{grid-template-columns:72px 1fr;padding:10px}.atlrow .win{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:no-preference){.pill.vivo{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.6}}}
</style>

<header class="board">
  <div class="tri"></div>
  <div class="wrap">
    <div class="eyebrow">XLIX edición · Red AEFE Chile</div>
    <h1 id="evName">Juegos Inter Alianzas 2026</h1>
    <div class="motto">Nous sommes tous Inter-Alliances</div>
    <div class="meta">
      <span>Sede <b id="evSede">por definir</b></span>
      <span>Fechas <b id="evFechas">por definir</b></span>
      <span class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Conectando…</span></span>
    </div>
    <div class="crests" id="crests"></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="crono" aria-selected="true">Cronograma</button>
      <button role="tab" data-t="posiciones" aria-selected="false">Posiciones</button>
      <button role="tab" data-t="atletismo" aria-selected="false"><svg class="ic atl" style="width:18px;height:18px;vertical-align:-3px;margin-right:4px" aria-hidden="true"><use href="#i-atl"/></svg>Atletismo</button>
      <button role="tab" data-t="medallero" aria-selected="false">Medallero</button>
      
    </nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="sheetWrap"></div>
<div class="toast" id="toast" hidden></div>

/* ---------- cálculos ---------- */
function h2h(tid,x,y){const m=S.partidos.find(p=>p.torneo===tid&&p.estado==="final"&&hasScore(p)&&((p.a===x&&p.b===y)||(p.a===y&&p.b===x)));if(!m)return 0;const wx=(m.a===x?+m.sa>+m.sb:+m.sb>+m.sa);return wx?-1:1}
function tabla(tid){
  const t=tor(tid);const rows={};const ps=S.partidos.filter(p=>p.torneo===tid);
  ps.forEach(p=>[p.a,p.b].forEach(x=>{if(x&&!rows[x])rows[x]={id:x,pj:0,g:0,p:0,f:0,c:0,pts:0}}));
  ps.filter(p=>p.estado==="final"&&hasScore(p)&&+p.sa!==+p.sb).forEach(p=>{
    const A=rows[p.a],B=rows[p.b],sa=+p.sa,sb=+p.sb;if(!A||!B)return;
    A.pj++;B.pj++;A.f+=sa;A.c+=sb;B.f+=sb;B.c+=sa;
    const [W,L,,ls]=sa>sb?[A,B,sa,sb]:[B,A,sb,sa];W.g++;L.p++;
    if(t.dep==="bas"){W.pts+=2;L.pts+=1}else{if(ls===0){W.pts+=3}else{W.pts+=2;L.pts+=1}}
  });
  const out=Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.f-y.c)-(x.f-x.c)||y.f-x.f||tname(x.id).localeCompare(tname(y.id)));
  for(let i=0;i<out.length-1;i++){const same=out.filter(r=>r.pts===out[i].pts);if(same.length===2&&out[i+1].pts===out[i].pts&&out[i].pj){if(h2h(tid,out[i].id,out[i+1].id)>0){[out[i],out[i+1]]=[out[i+1],out[i]]}i++}}
  const done=ps.length>0&&ps.every(p=>p.estado==="final");
  return {rows:out,done,total:ps.length,jug:ps.filter(p=>p.estado==="final").length};
}
function atlPuntos(){
  const P={};teams().forEach(t=>P[t.id]={id:t.id,pts:0,pl:[0,0,0,0,0,0,0,0]});
  S.atle.forEach(a=>(a.res||[]).forEach((r,i)=>{if(!r?.liceo||i>7)return;const x=P[r.liceo]||(P[r.liceo]={id:r.liceo,pts:0,pl:[0,0,0,0,0,0,0,0]});x.pts+=PTS[i]*(a.relevo?2:1);x.pl[i]++}));
  return Object.values(P).sort((x,y)=>y.pts-x.pts||(()=>{for(let i=0;i<8;i++)if(y.pl[i]!==x.pl[i])return y.pl[i]-x.pl[i];return 0})());
}
function medallero(){
  const m={};teams().forEach(t=>m[t.id]={id:t.id,o:0,p:0,b:0});
  const add=(id,k)=>{if(!id)return;(m[id]||(m[id]={id,o:0,p:0,b:0}))[k]++};
  TORNEOS.forEach(t=>{const r=tabla(t.id);if(r.done)["o","p","b"].forEach((k,i)=>r.rows[i]&&add(r.rows[i].id,k))});
  S.atle.forEach(a=>(a.res||[]).slice(0,3).forEach((r,i)=>add(r?.liceo,["o","p","b"][i])));
  return Object.values(m).sort((x,y)=>y.o-x.o||y.p-x.p||y.b-x.b||tname(x.id).localeCompare(tname(y.id)));
}

function render(){
  const c=S.cfg||{};
  $("#evName").textContent=c.nombre||"Juegos Inter Alianzas 2026";
  $("#evSede").textContent=c.sede||"por definir";
  $("#evFechas").textContent=c.fechas||"por definir";
  $("#crests").innerHTML=teams().map(t=>`<button class="crest" data-team="${esc(t.id)}" aria-label="Ver nómina de ${esc(tname(t.id))}">${logo(t.id)}${esc(tname(t.id))}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===S.tab));
  renderSheet();
  $("#main").innerHTML={crono:vCrono,posiciones:vPos,atletismo:vAtle,medallero:vMed,ajustes:vAjustes}[S.tab]();
}
function teamHTML(id,right){const sw=logo(id);const nm=`<span class="nm">${esc(tname(id))}</span>`;return `<span class="team${right?" r":""}">${right?nm+sw:sw+nm}</span>`}
function estadoPill(p){return p.estado==="vivo"?`<span class="pill vivo">En juego</span>`:p.estado==="final"?`<span class="pill final">Final</span>`:""}
function matchHTML(p){
  const t=tor(p.torneo)||{dep:"bas",cat:""};const has=hasScore(p),fin=p.estado==="final";
  const aw=has&&+p.sa>+p.sb,bw=has&&+p.sb>+p.sa;
  const sc=has?`<span class="${fin&&!aw?"lz":""}">${esc(p.sa)}</span><span class="v">–</span><span class="${fin&&!bw?"lz":""}">${esc(p.sb)}</span>`:`<span class="v">vs</span>`;
  const meta=[`<span class="pill cat ${t.cat.toLowerCase()}">${t.cat}</span>`,estadoPill(p),p.arbitros&&`<span>Árbitros: ${esc(p.arbitros)}</span>`,p.cancha&&S.fS!=="x"&&`<span>${esc(p.cancha)}</span>`].filter(Boolean).join("");
  const open=S.open===p.id;
  return `<div class="item"><button class="match${S.canWrite?" can":""}" data-open="${esc(p.id)}" aria-expanded="${open}" aria-label="${DEP[t.dep]} ${t.cat} ${esc(tname(p.a))} contra ${esc(tname(p.b))} ${esc(p.hora)}">
    <span class="hora">${ic(t.dep)}${esc(p.hora||"—")}</span>${teamHTML(p.a)}<span class="score">${sc}</span>${teamHTML(p.b,true)}<span class="mrow2">${meta}</span></button>
    ${open&&S.canWrite?editorHTML(p):""}</div>`;
}

   <div class="fields">
    <label>${unit} ${esc(tname(p.a))}<input id="e-sa" type="number" min="0" inputmode="numeric" value="${esc(p.sa??"")}"></label>

    <label>Estado<select id="e-st">${[["prog","Programado"],["vivo","En juego"],["final","Final"]].map(([k,l])=>`<option value="${k}" ${(p.estado||"prog")===k?"selected":""}>${l}</option>`).join("")}</select></label>

   <span class="sub">${t?.dep==="vol"?"Al mejor de 3 sets: anota 2–0 o 2–1.":"Anota el marcador final. Si hay empate se juega suplementario."}</span></div></form>`;
}
function atlRowHTML(a,hora,faseTxt){

function libres(ps){const en=new Set(ps.flatMap(p=>[p.a,p.b]));return teams().filter(t=>!en.has(t.id)).map(t=>tname(t.id))}
function vCrono(){
  if(!S.loaded.p)return `<div class="empty">Cargando cronograma…</div>`;
  const fechas=[...new Set([...S.partidos.map(p=>p.fecha),...S.atle.map(a=>a.fecha),...(S.cfg?.eventos||[]).map(e=>e.fecha)].filter(Boolean))].sort();
  if(S.fD===null){const t=todayISO();S.fD=fechas.includes(t)?t:"all"}
  const all=S.partidos,vivo=all.filter(p=>p.estado==="vivo"),fin=all.filter(p=>p.estado==="final").length;
  const depChips=[["all","Todos",""],["bas","Básquetbol","bas"],["vol","Vóleibol","vol"],["atl","Atletismo","atl"]].map(([k,l,d])=>`<button class="chip" data-fs="${k}" aria-pressed="${S.fS===k}">${d?ic(d):""}${l}</button>`).join("");
  const diaChips=`<button class="chip" data-fd="all" aria-pressed="${S.fD==="all"}">Todos los días</button>`+fechas.map(f=>`<button class="chip" data-fd="${f}" aria-pressed="${S.fD===f}">${esc(DIAC[f]||f)}</button>`).join("");
  const days=(S.fD==="all"?fechas:[S.fD]).map(f=>{
    const secs=[];
    const ev=(S.cfg?.eventos||[]).filter(e=>e.fecha===f).sort((a,b)=>a.hora.localeCompare(b.hora));
    if(S.fS==="all"&&ev.length)secs.push(`<section class="sport"><h3>${ic("evt")}Actividades</h3><div class="list">${ev.map(e=>`<div class="item evt"><span class="hora">${esc(e.hora)}</span><span><b>${esc(e.nombre)}</b>${e.lugar?` <span class="sub">· ${esc(e.lugar)}</span>`:""}</span></div>`).join("")}</div></section>`);
    if(S.fS==="all"||S.fS==="atl"){
      const rows=[];S.atle.filter(a=>a.fecha===f).forEach(a=>{if(a.serie)rows.push([a.serie,a.orden||0,a,"Series"]);rows.push([a.hora,a.orden||0,a,a.fase||"Final"])});
      rows.sort((x,y)=>String(x[0]).localeCompare(y[0])||x[1]-y[1]);
      if(rows.length)secs.push(`<section class="sport"><h3>${ic("atl")}Atletismo <span class="sub" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400">Pista atlética</span></h3><div class="block"><div class="bcap"><span>Mañana</span></div><div class="list">${rows.map(r=>atlRowHTML(r[2],r[0],r[3])).join("")}</div></div></section>`);
    }
    ["bas","vol"].forEach(d=>{
      if(S.fS!=="all"&&S.fS!==d)return;
      const ps=S.partidos.filter(p=>p.fecha===f&&tor(p.torneo)?.dep===d).sort((a,b)=>String(a.hora).localeCompare(b.hora)||a.torneo.localeCompare(b.torneo));
      if(!ps.length)return;
      const blocks=[["Mañana",ps.filter(p=>p.hora<"13:00")],["Tarde",ps.filter(p=>p.hora>="13:00")]].filter(b=>b[1].length);
      const cs=[...new Set(ps.map(p=>p.cancha).filter(Boolean))];
      secs.push(`<section class="sport"><h3>${ic(d)}${DEP[d]}${cs.length===1?` <span class="sub" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400">${esc(cs[0])}</span>`:""}</h3>${blocks.map(([n,b])=>{const lb=libres(b);return `<div class="block"><div class="bcap"><span>${blocks.length>1?n:""}</span>${lb.length?`<span>Libre: ${esc(lb.join(", "))}</span>`:""}</div><div class="list">${b.map(matchHTML).join("")}</div></div>`}).join("")}</section>`);
    });
    if(false){
    }
    if(!secs.length)return "";
    return `<section class="day"><div class="dayhead"><h2>${esc(DIAS[f]||f)}</h2></div>${secs.join("")}</section>`;
  }).join("");
  return `<div class="stats"><div class="stat"><div class="n" style="color:var(--red)">${vivo.length}</div><div class="l">En juego ahora</div></div>
    <div class="stat"><div class="n">${fin}/${all.length}</div><div class="l">Partidos jugados</div></div>
    <div class="stat"><div class="n">${S.atle.filter(a=>(a.res||[])[0]?.liceo).length}/${S.atle.length}</div><div class="l">Pruebas de atletismo</div></div></div>
    ${vivo.length?`<section class="sport"><h3 style="color:var(--red)">En juego ahora</h3><div class="list">${vivo.map(matchHTML).join("")}</div></section>`:""}
    <div class="filters"><div class="bar" role="group" aria-label="Día">${diaChips}</div><div class="bar" role="group" aria-label="Deporte">${depChips}</div></div>
    ${S.canWrite?`<p class="note">Toca un partido para anotar el marcador o marcarlo en juego. Toca una prueba de atletismo para cargar sus resultados. Los cambios aparecen al instante para todos.</p>`:`<p class="ro">Vista de solo lectura. Los resultados se actualizan solos.</p>`}
    ${days||`<div class="empty">No hay actividades con este filtro.</div>`}`;
}
function vPos(){
  const tablaHTML=t=>{const r=tabla(t.id);const vol=t.dep==="vol";
   return `<div class="tbl"><div class="tcap"><h3>${ic(t.dep)}${DEP[t.dep]} ${t.cat}</h3><span class="sub">${r.jug}/${r.total} jugados${r.done?" · terminado":""}</span></div>
   ${r.rows.length?`<table><thead><tr><th>Liceo</th><th>PJ</th><th>G</th><th>P</th><th>${vol?"SF":"PF"}</th><th>${vol?"SC":"PC"}</th><th>Dif</th><th>Pts</th></tr></thead><tbody>
   ${r.rows.map((x,i)=>`<tr><td><span class="pos">${i+1}</span> ${logo(x.id)}${esc(tname(x.id))}</td><td>${x.pj}</td><td>${x.g}</td><td>${x.p}</td><td>${x.f}</td><td>${x.c}</td><td>${x.f-x.c>0?"+":""}${x.f-x.c}</td><td class="pts">${x.pts}</td></tr>`).join("")}
   </tbody></table>`:`<div class="empty" style="border:0">Sin partidos cargados.</div>`}</div>`};
  const ap=atlPuntos();
  return `<p class="note">Todos contra todos. Básquetbol: 2 puntos por victoria y 1 por derrota; empate en puntos entre dos liceos se define por ganador en cancha y luego por diferencia de puntos. Vóleibol: 3 puntos por ganar 2–0, 2 al ganador y 1 al perdedor en un 2–1; empate se define por ganador en cancha y luego por diferencia de sets. Solo cuentan partidos marcados como Final.</p>
  <div class="tables">${TORNEOS.map(tablaHTML).join("")}</div>
  <div class="tbl"><div class="tcap"><h3>${ic("atl")}Atletismo por equipos</h3><span class="sub">12·9·7·5·4·3·2·1 · la posta vale doble</span></div>
   <table><thead><tr><th>Liceo</th><th>1°</th><th>2°</th><th>3°</th><th>Pts</th></tr></thead><tbody>
   ${ap.map((x,i)=>`<tr><td><span class="pos">${i+1}</span> ${logo(x.id)}${esc(tname(x.id))}</td><td>${x.pl[0]}</td><td>${x.pl[1]}</td><td>${x.pl[2]}</td><td class="pts">${x.pts}</td></tr>`).join("")}</tbody></table></div>`;
}
function vAtle(){
  const opts=sel=>`<option value="">—</option>`+teams().map(t=>`<option value="${esc(t.id)}" ${sel===t.id?"selected":""}>${esc(tname(t.id))}</option>`).join("");
  const form=a=>`<form class="card" data-atle="${esc(a.id)}"><h3>${ic("atl")}${esc(a.prueba)} · ${esc(a.cat)}</h3>
   <p class="note">Ingresa los lugares en orden. ${a.relevo?"En la posta, escribe el equipo o los integrantes.":"Puntaje 12·9·7·5·4·3·2·1."}</p>
   ${[0,1,2,3,4,5,6,7].map(i=>{const r=(a.res||[])[i]||{};return `<div class="resrow"><span class="medal ${i<3?"m"+(i+1):"mx"}">${i+1}</span><select id="a-l${i}" aria-label="Liceo ${i+1}° lugar">${opts(r.liceo)}</select><input id="a-n${i}" value="${esc(r.atleta||"")}" placeholder="${a.relevo?"Equipo":"Atleta"}" aria-label="Atleta ${i+1}° lugar"><input class="mkin" id="a-m${i}" value="${esc(r.marca||"")}" placeholder="Marca" aria-label="Marca ${i+1}° lugar"></div>`}).join("")}
   <div class="bar"><button class="btn" type="submit">Guardar resultados</button><button class="btn ghost" type="button" data-cancelatle>Cancelar</button></div></form>`;
  const card=a=>{
    if(S.editAt===a.id&&S.canWrite)return form(a);
    const res=(a.res||[]).map((r,i)=>({...r,i})).filter(r=>r.liceo||r.atleta);
    return `<div class="card" id="atl-${esc(a.id)}"><div class="tcap" style="padding:0"><h3>${ic("atl")}${esc(a.prueba)}</h3><span class="pill cat ${esc(String(a.cat).toLowerCase())}">${esc(a.cat)}</span></div>
    <span class="sub">${a.serie?`Series ${esc(a.serie)} · Final ${esc(a.hora)}`:`${esc(a.hora)} · ${esc(a.fase||"Final")}`}${a.relevo?" · puntaje doble":""}</span>
    ${res.length?`<div class="pod">${res.map(r=>`<span class="medal ${r.i<3?"m"+(r.i+1):"mx"}">${r.i+1}</span><span>${esc(r.atleta||"—")}<br><span class="sub">${r.liceo?logo(r.liceo)+" ":""}${esc(tname(r.liceo))}</span></span><span class="mk">${esc(r.marca||"")}</span><span class="pt">${r.liceo?PTS[r.i]*(a.relevo?2:1)+" pts":""}</span>`).join("")}</div>`:`<span class="sub">Sin resultados todavía.</span>`}
    ${S.canWrite?`<div><button class="btn ghost" data-editatle="${esc(a.id)}">${res.length?"Editar resultados":"Cargar resultados"}</button></div>`:""}</div>`};
  const list=S.atle.slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
  if(!S.loaded.a)return `<div class="empty">Cargando atletismo…</div>`;
  return `<p class="note">Jueves 8 de octubre en la pista atlética del Lycée Claude Gay. Hay medalla para el 1°, 2° y 3° de cada prueba y galvano para el primer liceo por equipos.</p>
   ${["Damas","Varones"].map(c=>{const l=list.filter(a=>a.cat===c);return l.length?`<section class="sport"><h2 style="display:flex;align-items:center;gap:8px">${ic("atl")}${c}</h2><div class="cards">${l.map(card).join("")}</div></section>`:""}).join("")||`<div class="empty">No hay pruebas cargadas.</div>`}`;
}
function vMed(){
  const m=medallero();const tot=x=>x.o+x.p+x.b;
  const cerrados=TORNEOS.filter(t=>tabla(t.id).done).map(t=>`${DEP[t.dep]} ${t.cat}`);
  return `<p class="note">Suma los podios de cada prueba de atletismo y el 1°, 2° y 3° de cada torneo de básquetbol y vóleibol, una vez jugados todos sus partidos. Torneos cerrados: ${cerrados.length?esc(cerrados.join(", ")):"ninguno todavía"}.</p>
  <div class="tbl"><table><thead><tr><th>Liceo</th><th><span class="medal m1">O</span></th><th><span class="medal m2">P</span></th><th><span class="medal m3">B</span></th><th>Total</th></tr></thead><tbody>
  ${m.map((x,i)=>`<tr><td><span class="pos">${i+1}</span> ${logo(x.id)}${esc(tname(x.id))}</td><td class="pts">${x.o}</td><td class="pts">${x.p}</td><td class="pts">${x.b}</td><td>${tot(x)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

const NDEP=[["bas","Básquetbol"],["vol","Vóleibol"],["atl","Atletismo"]];
function renderSheet(){
  const w=$("#sheetWrap");if(!S.team){w.innerHTML="";document.body.style.overflow="";return}
  const id=S.team,n=S.nom[id]||{};document.body.style.overflow="hidden";
  const cat=(k,l)=>`<section class="sport"><div class="cattitle">${l}</div><div class="rgrid">${NDEP.map(([d,dl])=>{
    const r=(n[k]||{})[d]||{};const js=(r.jugadores||[]).filter(Boolean);
    if(S.editNom)return `<div class="roster"><h3>${ic(d)}${dl}</h3>
      <label>Entrenador(es)<input id="n-${k}-${d}-e" value="${esc(r.entrenador||"")}"></label>
      <label>Deportistas, uno por línea<textarea id="n-${k}-${d}-j" placeholder="4 · Nombre Apellido">${esc(js.join("\n"))}</textarea></label></div>`;
    return `<div class="roster"><h3>${ic(d)}${dl}</h3><div class="coach">Entrenador: <b>${esc(r.entrenador||"por confirmar")}</b></div>
      ${js.length?`<ol>${js.map(j=>`<li>${esc(j)}</li>`).join("")}</ol><span class="sub">${js.length} deportistas</span>`:`<span class="sub">Nómina pendiente.</span>`}</div>`}).join("")}</div></section>`;
  const jueces=()=>`<section class="sport"><div class="cattitle">Jueces</div><div class="rgrid">${[["bas","Básquetbol"],["vol","Vóleibol"]].map(([d,dl])=>{
    const js=((n.jueces||{})[d]||[]).filter(Boolean);
    if(S.editNom)return `<div class="roster"><h3>${ic(d)}${dl}</h3><label>Jueces, uno por línea<textarea id="n-j-${d}" style="min-height:80px">${esc(js.join("\n"))}</textarea></label></div>`;
    return `<div class="roster"><h3>${ic(d)}${dl}</h3>${js.length?`<ol>${js.map(j=>`<li>${esc(j)}</li>`).join("")}</ol>`:`<span class="sub">Pendiente.</span>`}</div>`}).join("")}</div></section>`;
  const body=`<div class="sheethead">${logo(id)}<h2>${esc(tname(id))}</h2><button class="x-btn" data-closeteam aria-label="Cerrar">×</button></div>
    ${n.jefe||S.editNom?(S.editNom?`<label>Jefe de delegación<input id="n-jefe" value="${esc(n.jefe||"")}"></label>`:`<div class="coach">Jefe de delegación: <b>${esc(n.jefe)}</b></div>`):""}
    ${cat("damas","Damas")}${cat("varones","Varones")}${jueces()}
    ${S.editNom?`<p class="note">Escribe solo nombres, y el número de camiseta si quieres. No pongas RUT, fechas de nacimiento ni teléfonos: cualquiera con acceso a la página puede verlos.</p><div class="bar"><button class="btn" data-savenom>Guardar nómina</button><button class="btn ghost" data-cancelnom>Cancelar</button></div>`
      :S.canWrite?`<div><button class="btn ghost" data-editnom>Editar nómina</button></div>`:""}`;
  w.innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Nómina de ${esc(tname(id))}">${body}</div></div>`;
}
async function saveNom(btn){
  const id=S.team;const doc={jefe:($("#n-jefe")?.value||"").trim()};
  for(const k of ["damas","varones"]){doc[k]={};for(const [d] of NDEP){doc[k][d]={entrenador:$(`#n-${k}-${d}-e`).value.trim(),jugadores:$(`#n-${k}-${d}-j`).value.split("\n").map(x=>x.trim()).filter(Boolean)}}}
  doc.jueces={};for(const d of ["bas","vol"])doc.jueces[d]=$(`#n-j-${d}`).value.split("\n").map(x=>x.trim()).filter(Boolean);
  btn.disabled=true;
  try{await S.db.doc("nominas/"+id).set(doc);S.editNom=false;toast("Nómina guardada.")}catch(e){dbErr(e)}
  btn.disabled=false;render();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.team&&!S.editNom){S.team=null;render()}});

/* ---------- acciones ---------- */
function readTeams(){return [...document.querySelectorAll(".teamrow")].map(r=>({id:r.dataset.id,nombre:r.querySelector(".t-nom").value.trim(),ciudad:r.querySelector(".t-ciu").value.trim(),sigla:r.querySelector(".t-sig").value.trim().toUpperCase(),color:r.querySelector(".t-col").value})).filter(t=>t.nombre)}
document.addEventListener("click",e=>{
  if(e.target.matches("[data-scrim]")&&!S.editNom){S.team=null;render();return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.team){S.team=b.dataset.team;S.editNom=false;render();return}
  if(b.hasAttribute("data-closeteam")){S.team=null;S.editNom=false;render();return}
  if(b.hasAttribute("data-editnom")){S.editNom=true;render();return}
  if(b.hasAttribute("data-cancelnom")){S.editNom=false;render();return}
  if(b.hasAttribute("data-savenom")){saveNom(b);return}
  if(b.dataset.t){S.tab=b.dataset.t;S.open=null;S.editAt=null;try{localStorage.setItem("ia-tab",S.tab)}catch{}render();window.scrollTo(0,0);return}
  if(b.dataset.fs){S.fS=b.dataset.fs;render();return}
  if(b.dataset.fd){S.fD=b.dataset.fd;render();return}
  if(b.dataset.open!==undefined){if(!S.canWrite)return;S.open=S.open===b.dataset.open?null:b.dataset.open;render();return}
  if(b.dataset.goatl){S.tab="atletismo";S.editAt=S.canWrite?b.dataset.goatl:null;render();const el=document.querySelector(`[data-atle="${b.dataset.goatl}"]`)||document.getElementById("atl-"+b.dataset.goatl);el?.scrollIntoView({block:"start"});return}
  if(b.hasAttribute("data-close")){S.open=null;render();return}
  if(b.dataset.editatle){S.editAt=b.dataset.editatle;render();return}
  if(b.hasAttribute("data-cancelatle")){S.editAt=null;render();return}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const btn=f.querySelector("[type=submit]");if(btn)btn.disabled=true;
  try{
    if(f.dataset.save){
      const sa=$("#e-sa").value,sb=$("#e-sb").value,st=$("#e-st").value;
      if(st==="final"&&(sa===""||sb==="")){toast("Para cerrar el partido, anota ambos marcadores.");if(btn)btn.disabled=false;return}
      if(st==="final"&&+sa===+sb){toast("Un partido final no puede terminar empatado.");if(btn)btn.disabled=false;return}
      await S.db.doc("partidos/"+f.dataset.save).update({sa:sa===""?"":+sa,sb:sb===""?"":+sb,estado:st,hora:$("#e-hora").value.trim(),cancha:$("#e-can").value.trim()});
      S.open=null;toast("Marcador guardado.");
    }else if(f.id==="evForm"){
      await S.db.doc("config/torneo").update({nombre:$("#c-nom").value.trim(),sede:$("#c-sede").value.trim(),fechas:$("#c-fec").value.trim(),equipos:readTeams()});
      toast("Datos guardados.");
    }else if(f.dataset.atle){
      const res=[0,1,2,3,4,5,6,7].map(i=>({liceo:f.querySelector("#a-l"+i).value,atleta:f.querySelector("#a-n"+i).value.trim(),marca:f.querySelector("#a-m"+i).value.trim()}));
      let last=res.length;while(last>0&&!res[last-1].liceo&&!res[last-1].atleta&&!res[last-1].marca)last--;
      await S.db.doc("atletismo/"+f.dataset.atle).update({res:res.slice(0,last)});
      S.editAt=null;toast("Resultados guardados.");
    }
  }catch(er){dbErr(er)}
  if(btn)btn.disabled=false;
  if(document.activeElement)document.activeElement.blur();
  render();
});
